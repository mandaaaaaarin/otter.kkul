body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.hero{background:linear-gradient(135deg,var(--o1),var(--o2));color:#fff;padding:40px 16px 70px;text-align:center}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--sub)}
.chip.on{background:var(--ink);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 10px;font-size:12.5px;color:var(--sub)}
.bar input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;width:46%;max-width:240px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{position:relative;border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;background:#fff;display:flex;flex-direction:column;gap:10px}
.rank{position:absolute;top:-1px;right:14px;background:linear-gradient(135deg,#ffb020,#ff8a00);color:#fff;font-size:11px;font-weight:900;padding:5px 8px 6px;border-radius:0 0 8px 8px}
.cat{align-self:flex-start;font-size:11px;font-weight:800;color:#e8590c;background:#fff0e6;padding:3px 9px;border-radius:999px}
.name{font-size:16px;font-weight:800;line-height:1.4;padding-right:34px}
.quote{font-size:13px;line-height:1.55;background:#faf6f1;border-radius:10px;padding:9px 11px;color:#4a3b2e}
.quote em{display:block;font-style:normal;font-size:11.5px;color:var(--sub);margin-top:4px}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:8px}
.cnt{font-size:12.5px;font-weight:800;color:var(--o2)}
.go{text-decoration:none;font-size:13px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--o1),var(--o2));padding:9px 14px;border-radius:10px;white-space:nowrap}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
footer{text-align:center;color:var(--sub);font-size:12px;line-height:1.8;padding:26px 16px 40px}
footer a{color:var(--ink);font-weight:800}
@media(max-width:640px){.grid{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style></head><body>

<script>
const D=[{"n": "프로핏", "c": "먹을거리", "u": "https://link.coupang.com/a/h1t50y6b6a", "k": 0, "q": [{"u": "otter.kkul", "t": "회사갈때 하나씩 챙겨가면 개꿀", "m": true}]}, {"n": "쉐이커", "c": "주방", "u": "https://link.coupang.com/a/h1t0xhATmK", "k": 0, "q": [{"u": "otter.kkul", "t": "가성비로 쓰는데 비싼거 필요없다", "m": true}]}, {"n": "무인양품 방향제", "c": "생활·청소", "u": "https://link.coupang.com/a/h1Okfe3KDc", "k": 0, "q": [{"u": "otter.kkul", "t": "향기 진짜 정신나감, 현관에 두고 사용중, 사시사철 금목서랑 지낼 수 있음, 다른 방향제 안 쓰고 이것만 씀", "m": true}]}, {"n": "PDRN크림", "c": "뷰티", "u": "https://link.coupang.com/a/h1O13vsULY", "k": 0, "q": [{"u": "otter.kkul", "t": "추천해준 사람 복받아라, 쓰고나서 피부 넘 좋아짐", "m": true}]}, {"n": "샤오커오라사탕", "c": "먹을거리", "u": "https://link.coupang.com/a/h1O8fDSVZA", "k": 0, "q": [{"u": "otter.kkul", "t": "원당도 없는데 인간 사료 그 자체, 회사에서 맨날 달고 산다, 따라 산 사람 많음", "m": true}]}, {"n": "정리수납함", "c": "생활·청소", "u": "https://link.coupang.com/a/h1PdT3ZSCq", "k": 0, "q": [{"u": "otter.kkul", "t": "이거 쓰고 화장실 드디어 정리 다 함, 하나만 사서 써도 정리되는 기분", "m": true}]}, {"n": "거꾸로캡", "c": "주방", "u": "https://link.coupang.com/a/h1PpY9FTZA", "k": 0, "q": [{"u": "otter.kkul", "t": "맨날 중심 맞춘다고 난리쳤는데 안 넘어지고 바로 잘 나옴", "m": true}]}],CATS=["먹을거리", "주방", "생활·청소", "뷰티"];let cat="전체";
